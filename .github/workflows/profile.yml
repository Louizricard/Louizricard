name: Atualizar visuais do perfil
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [main, profile-refresh]
    paths:
      - '.github/workflows/profile.yml'
      - 'scripts/update_stats.py'
permissions:
  contents: write
concurrency:
  group: profile-visuals-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Estatísticas públicas
        run: python scripts/update_stats.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Snake de contribuições
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: Louizricard
          outputs: |
            assets/snake.svg?color_snake=%2319e6a7&color_dots=%23102743,%231d4b50,%2325726b,%23389c85,%2375d6b8
      - name: Publicar visuais atualizados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/stats-mobile.svg assets/snake.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: atualizar estatísticas e snake'
            git push
          fi
